name: CI/CD

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:

jobs:
  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: Terraform plan
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }} -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }} -backend-config=container_name=tfstate -backend-config=key=wrenchbox-k8s.tfstate
      - run: terraform plan -input=false -var "key_vault_name=${{ vars.KEY_VAULT_NAME }}"

  apply:
    name: Terraform apply
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          terraform init -input=false -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }} -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }} -backend-config=container_name=tfstate -backend-config=key=wrenchbox-k8s.tfstate
          terraform apply -input=false -auto-approve \
            -var "key_vault_name=${{ vars.KEY_VAULT_NAME }}" \
            -var "function_backend_url_homolog=${{ vars.FUNCTION_BACKEND_URL_HOMOLOG }}" \
            -var "function_backend_url_prod=${{ vars.FUNCTION_BACKEND_URL_PROD }}" \
            -var "api_backend_url_homolog=${{ vars.API_BACKEND_URL_HOMOLOG }}" \
            -var "api_backend_url_prod=${{ vars.API_BACKEND_URL_PROD }}" \
            -var "alert_email=${{ vars.ALERT_EMAIL }}"
